<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 280px; background: #0f0f0f; color: #f1f1f1; font: 15px/20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { padding: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; }
  .brand svg { width: 30px; height: 30px; }
  p { color: #aaaaaa; margin: 8px 0 16px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid #272727; }
  .row b { font-weight: 700; }
  .switch { position: relative; width: 44px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; cursor: pointer; background: #3f3f3f; border-radius: 9999px; transition: .2s; }
  .slider::before { content: ""; position: absolute; width: 20px; height: 20px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .2s; }
  input:checked + .slider { background: #ff0033; }
  input:checked + .slider::before { transform: translateX(20px); }
  a.btn { display: block; text-align: center; background: #f1f1f1; color: #0f0f0f; font-weight: 700; text-decoration: none; border-radius: 9999px; padding: 8px 16px; margin-top: 8px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 24 24"><path fill="#ff0033" d="M6 3.5h12a5 5 0 0 1 5 5v7a5 5 0 0 1-5 5H6a5 5 0 0 1-5-5v-7a5 5 0 0 1 5-5z"/><path fill="#fff" transform="translate(6.6 6.6) scale(0.45)" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      YouTube X
    </div>
    <p>X'in düzeni, YouTube'un renkleri.</p>
    <div class="row">
      <b>X görünümü</b>
      <label class="switch"><input type="checkbox" id="on"><span class="slider"></span></label>
    </div>
    <a class="btn" href="https://www.youtube.com/" target="_blank">YouTube'u aç</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
